project:
  type: website
  output-dir: _site

website:
  title: "Great Salt Lake Forecast"
  site-url: "https://jcblsn.github.io/gsl-forecast/"
  repo-url: "https://github.com/jcblsn/gsl-forecast"
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Forecast
      - href: methodology.qmd
        text: Method and evidence
    right:
      - icon: github
        href: "https://github.com/jcblsn/gsl-forecast"
        aria-label: Source repository
  page-footer:
    left: "South-arm calendar-month mean at USGS gauge 10010000"
    right: "Experimental research forecast"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    page-layout: full
    include-in-header:
      text: |
        <meta name="description" content="An experimental forecast of Great Salt Lake south-arm monthly mean elevation.">
