name: monthly-forecast

on:
  schedule:
    - cron: "0 14 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run --frozen gsl-pipeline
      - run: uv run --frozen gsl-cv --no-plots
      - name: Forecast
        id: forecast
        continue-on-error: true
        run: |
          cv=$(ls -t outputs/cv_results_*.parquet | head -1)
          uv run --frozen gsl-forecast --export forecasts/$(date -u +%Y-%m)-01.csv \
            --intervals "$cv" --site-data-dir site/data
      - name: Forecast with incomplete covariates
        if: steps.forecast.outcome == 'failure'
        run: |
          cv=$(ls -t outputs/cv_results_*.parquet | head -1)
          uv run --frozen gsl-forecast --allow-incomplete \
            --export forecasts/$(date -u +%Y-%m)-01.csv --intervals "$cv" \
            --site-data-dir site/data
      - run: uv run --frozen gsl-verify
      - name: Commit dated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecasts site/data
          git diff --cached --quiet || git commit -m "Forecast issued $(date -u +%Y-%m-%d)"
          git push
