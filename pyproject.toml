[project]
name = "gsl-forecast"
version = "0.1.0"
description = "Forecasting the Great Salt Lake's depth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.0",
    "pandas>=2.2.3",
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
